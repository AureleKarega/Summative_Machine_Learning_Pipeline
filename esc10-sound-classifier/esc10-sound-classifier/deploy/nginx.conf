events {}
http {
  resolver 127.0.0.11 valid=5s;          # Docker DNS: re-resolve so every scaled replica gets traffic
  server {
    listen 80;
    client_max_body_size 20m;
    location / {
      set $upstream http://api:8000;
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_read_timeout 120s;
    }
  }
}
